# 이 파일은 nginx가 켜질 때 ${이름}을 환경변수로 바꿔요 (정해 둔 이름만 바뀌고 $host 같은 nginx 값은 그대로)
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 글자 파일(코드·스타일·화면)은 줄여서 보내요 (약 500KB 덜 받아요). 그림·글꼴은 이미 줄어 있어요
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

    # www.oracyblock.com → oracyblock.com (주소를 하나로)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # 서버(API)는 같은 주소의 /api 로 받아서 넘겨요. 서버가 늦게 켜져도 웹은 먼저 떠요
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 주소(/fix, /tower ...)로 바로 들어와도 index.html
    # 보안 머리말. 마이크는 우리 사이트만 쓸 수 있게 (말로 대답하기)
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "no-cache" always;
        # 네이버 서치어드바이저 소유 확인 (.env 의 NAVER_SITE_VERIFICATION, 켜질 때 채워져요)
        sub_filter '</head>' '<meta name="naver-site-verification" content="${NAVER_SITE_VERIFICATION}" /></head>';
        sub_filter_once on;
        try_files $uri $uri/ /index.html;
    }

    # 그림·코드: 이름에 판 번호가 붙어 있어서 새 판이면 이름이 바뀌어요 → 1년 동안 휴대폰에 둬도 돼요
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
