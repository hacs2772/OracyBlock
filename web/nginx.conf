server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # www.oracyblock.com → oracyblock.com (주소를 하나로)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # 서버(API)는 같은 주소의 /api 로 받아서 넘겨요. 서버가 늦게 켜져도 웹은 먼저 떠요
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 주소(/fix, /tower ...)로 바로 들어와도 index.html
    # 보안 머리말. 마이크는 우리 사이트만 쓸 수 있게 (말로 대답하기)
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
