# main에 올라갈 때마다 자동 검사 (깨진 판이 집 PC로 가기 전에 알려 줘요)
# - 웹: 대사 검사(check-talks) + 빌드
# - 서버: 컴파일(bootJar)
# 실패하면 GitHub이 메일로 알려 줘요. 저장소 Actions 탭에서 어디가 틀렸는지 볼 수 있어요
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 대사 검사
        run: npm run check
      - name: 빌드
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 서버 컴파일
        run: ./gradlew --no-daemon -q bootJar
