# main에 올라갈 때마다 자동 검사 (깨진 판이 집 PC로 가기 전에 알려 줘요)
# - 웹: 대사 검사(check-talks) + 빌드
# - 서버: 테스트(탑·알림 규칙이 웹과 같은지) + 컴파일(bootJar)
# 실패하면 GitHub이 메일로 알려 줘요. 저장소 Actions 탭에서 어디가 틀렸는지 볼 수 있어요
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 대사 검사
        run: npm run check
      - name: 속도 검사 (앱을 열 때 멈추지 않게)
        run: npm run perf
      - name: 빌드
        run: npm run build
      - name: 서버 테스트 답 파일이 웹 규칙과 같은지
        run: npm run fixture && git diff --exit-code ../backend/src/test/resources/rules-fixture.json

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 서버 테스트 (탑·알림 규칙이 웹과 같은지)
        run: ./gradlew --no-daemon test
      - name: 서버 컴파일
        run: ./gradlew --no-daemon -q bootJar

  # 실제로 켜서 해 보기: DB · 서버 · 웹을 띄우고 브라우저로 대화 하나를 끝까지 (web/e2e/smoke.mjs)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, backend]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oracyblock
          POSTGRES_USER: oracyblock
          POSTGRES_PASSWORD: e2e-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oracyblock" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      DB_URL: jdbc:postgresql://localhost:5432/oracyblock
      DB_USERNAME: oracyblock
      DB_PASSWORD: e2e-only-password
      JWT_SECRET: e2e-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: 서버 켜기
        working-directory: backend
        run: |
          ./gradlew --no-daemon -q bootJar
          nohup java -jar build/libs/app.jar > ../server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/v1/ping && break; sleep 2; done
          curl -sf localhost:8080/api/v1/ping
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 켜기
        working-directory: web
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173/about > /dev/null && break; sleep 1; done
      - name: 브라우저 준비
        working-directory: web
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: 대화 하나 끝까지 해 보기 (크롬 엔진)
        working-directory: web
        run: BASE=http://localhost:4173 node e2e/smoke.mjs
      - name: 대화 하나 끝까지 해 보기 (아이폰 사파리 엔진 WebKit)
        working-directory: web
        run: BASE=http://localhost:4173 BROWSER=webkit node e2e/smoke.mjs
      - name: 실패하면 서버 기록 보기
        if: failure()
        run: tail -n 80 server.log; tail -n 20 web.log

